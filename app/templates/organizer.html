<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Организатор | Sofia City Quest</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><main class="shell organizer-shell"><section class="card organizer-head"><div><div class="eyebrow">RACE CONTROL</div><h1 id="raceName">Състезание</h1><p class="lead-small">Код: <strong id="raceCode">—</strong> · Статус: <strong id="raceStatus">—</strong></p></div><div class="organizer-actions"><button id="startRace" class="primary">Старт на всички отбори</button><a class="secondary button-link" href="/play">Моята игра</a><a class="text-link" href="/leaderboard">Класиране</a></div></section><section class="organizer-grid"><div class="card"><h2>QR за присъединяване</h2><img id="joinQr" class="qr" alt="QR код за състезанието"><p class="muted">Сканирането отваря формата с предварително попълнен код на състезанието.</p></div><div class="card"><h2>Live карта</h2><div id="organizerMap"></div><p class="muted">Показва последната GPS позиция, изпратена от всеки отбор. Обновяване на 10 секунди.</p></div></section><section class="card"><div class="section-title-row"><h2>Отбори</h2><span id="teamCount" class="chip"></span></div><div id="teamList" class="team-list"></div><p id="orgMsg" class="msg"></p></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/static/organizer.js"></script></body></html>
