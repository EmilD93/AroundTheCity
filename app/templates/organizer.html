<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>Race Control · AroundTheCity</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head>
<body class="page-organizer"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<main class="shell organizer-shell">
  <section class="card organizer-head"><div><div class="eyebrow"><span class="pulse-dot"></span> RACE CONTROL</div><h1 id="raceName">Състезание</h1><p class="lead-small">Код <strong id="raceCode">—</strong><span class="dot-sep">•</span>Статус <strong id="raceStatus">—</strong></p></div><div class="organizer-actions"><button id="startRace" class="primary">Старт на всички</button><a class="secondary button-link" href="/play">Моята игра</a><a class="nav-pill" href="/leaderboard">Класиране</a></div></section>
  <section class="organizer-grid"><div class="card qr-card"><div class="card-kicker">JOIN THE RACE</div><h2>QR за присъединяване</h2><div class="qr-wrap"><img id="joinQr" class="qr" alt="QR код за състезанието"></div><p class="muted">Сканирането отваря формата с предварително попълнен код.</p></div><div class="card map-control-card"><div class="section-title-row"><div><div class="card-kicker">LIVE TRACKING</div><h2>Позиции на отборите</h2></div><span class="map-status">● LIVE</span></div><div id="organizerMap"></div></div></section>
  <section class="card"><div class="section-title-row"><div><div class="card-kicker">TEAMS</div><h2>Контролен панел</h2></div><span id="teamCount" class="chip"></span></div><div id="teamList" class="team-list"></div><p id="orgMsg" class="msg"></p></section>
</main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/static/organizer.js"></script></body></html>
