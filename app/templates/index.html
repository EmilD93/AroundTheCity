<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071018">
  <title>AroundTheCity · Sofia City Quest</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-home">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main class="shell hero-shell">
    <nav class="topbar">
      <a class="brand" href="/"><span class="brand-mark">A</span><span><strong>AroundTheCity</strong><small>Sofia quest experience</small></span></a>
      <a class="nav-pill" href="/leaderboard"><span>🏁</span> Live класиране</a>
    </nav>

    <section class="hero-grid">
      <div class="hero-copy">
        <div class="eyebrow"><span class="pulse-dot"></span> LIVE CITY ADVENTURE · SOFIA</div>
        <h1>Градът е <span class="accent-text">игралното поле.</span></h1>
        <p class="lead">10 мисии. Центърът на София. Таймерът вече тече.</p>
        <div class="hero-punch" aria-label="Основни характеристики">
          <span>10 MISSIONS</span><span>SOFIA</span><span>LIVE</span>
        </div>
        <div class="quest-path" aria-label="Маршрут на приключението">
          <div class="quest-node active">01</div><div class="quest-line"></div><div class="quest-node">04</div><div class="quest-line"></div><div class="quest-node">07</div><div class="quest-line"></div><div class="quest-node finish">10</div>
        </div>
        <p class="hero-note">Старт: <strong>градина „Кристал“</strong></p>
      </div>

      <section class="card create-card">
        <div class="card-kicker">СЪЗДАЙ СВОЯ ОТБОР</div>
        <h2>Приключението започва тук.</h2>
        <form id="teamForm">
          <label><span>Име на отбора</span><input id="teamName" required minlength="2" placeholder="Напр. Нощните лисици" autocomplete="off"></label>
          <div class="form-split">
            <label class="upload-field"><span>Снимка / лого</span><input id="teamLogo" type="file" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG или WEBP · до 2 MB</small></label>
            <label><span>Играчи</span><textarea id="players" rows="3" placeholder="Едно име на ред"></textarea></label>
          </div>
          <div class="mode-selector" role="radiogroup" aria-label="Режим на игра">
            <label class="mode-option"><input type="radio" name="mode" value="fun" checked><span class="mode-icon">🧭</span><span><b>Adventure</b></span></label>
            <label class="mode-option"><input type="radio" name="mode" value="race"><span class="mode-icon">⚡</span><span><b>Race</b></span></label>
          </div>
          <div id="raceFields" class="race-panel hidden">
            <div class="race-panel-title">RACE SETUP</div>
            <label><span>Код на съществуващо състезание</span><input id="competitionCode" placeholder="Напр. SOF123" autocomplete="off"></label>
            <label><span>Име на ново състезание</span><input id="competitionName" placeholder="Напр. Sofia Saturday Race" autocomplete="off"></label>
          </div>
          <button class="primary action-xl" type="submit"><span>Започни приключението</span><span class="button-arrow">→</span></button>
        </form>
        <p id="msg" class="msg"></p>
      </section>
    </section>

    <section class="resume-strip">
      <div class="resume-icon">↺</div>
      <div><h3>Имаш активна игра?</h3></div>
      <div class="resume-actions"><button id="resume" class="secondary">Продължи играта</button><button id="organizerResume" class="secondary hidden">Race control</button></div>
    </section>
  </main>
  <script src="/static/home.js"></script>
</body>
</html>
